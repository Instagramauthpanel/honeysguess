<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Live Data Terminal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.23.0/firebase-database-compat.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
  body { background: #fff; color: #000; font-size: 14px; }
  .hidden { display: none !important; }
  
  /* Login */
  #login-view { display: flex; justify-content: center; align-items: center; height: 100vh; background: #f5f5f5; }
  .login-box { background: #fff; border: 1px solid #000; padding: 30px; width: 350px; }
  .login-box h2 { margin-bottom: 15px; font-size: 16px; font-weight: bold; }
  .login-box input { width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #000; font-family: monospace; }
  .login-box button { width: 100%; padding: 8px; background: #000; color: #fff; border: none; cursor: pointer; font-family: monospace; }
  .login-box button:hover { background: #333; }
  .policy { margin-top: 20px; font-size: 11px; color: #666; border-top: 1px solid #ccc; padding-top: 10px; text-align: center; }

  /* Dashboard */
  #dashboard-view { height: 100vh; display: flex; flex-direction: column; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; border-bottom: 1px solid #000; background: #eee; flex-shrink: 0; }
  .top-bar input { padding: 5px; border: 1px solid #000; font-family: monospace; width: 200px; }
  .top-bar button { padding: 5px 10px; border: 1px solid #000; background: #fff; cursor: pointer; font-family: monospace; }
  
  .main-content { display: flex; flex: 1; overflow: hidden; }
  
  /* Room List */
  .room-list { width: 35%; border-right: 1px solid #000; overflow-y: auto; background: #fafafa; }
  .room-item { padding: 10px 15px; border-bottom: 1px solid #ccc; cursor: pointer; }
  .room-item:hover { background: #eee; }
  .room-item.active { background: #000; color: #fff; }
  .room-item .code { font-weight: bold; }
  .room-item .status { font-size: 11px; text-transform: uppercase; margin-top: 4px; }
  .no-rooms { padding: 20px; text-align: center; color: #666; }

  /* Room Detail */
  .room-detail { flex: 1; overflow-y: auto; padding: 20px; background: #fff; }
  .detail-section { margin-bottom: 20px; border: 1px solid #000; padding: 15px; }
  .detail-section h3 { font-size: 14px; font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid #000; padding-bottom: 5px; background: #eee; margin: -15px -15px 10px -15px; padding: 10px 15px; }
  
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 5px 10px; border-bottom: 1px solid #eee; font-size: 13px; }
  th { color: #666; font-weight: normal; width: 30%; }
  
  .guess-log { max-height: 250px; overflow-y: auto; border: 1px solid #eee; background: #fafafa; }
  .guess-row { padding: 5px 10px; border-bottom: 1px solid #eee; font-size: 12px; }
  
  .fair-play-banner { background: #fff; border: 1px solid #000; padding: 8px; margin-bottom: 0px; text-align: center; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #000; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-view">
  <div class="login-box">
    <h2>System Access</h2>
    <input type="password" id="pass-input" placeholder="Password" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">Enter</button>
    <div class="policy">
      Read-only access. No changes can be done here, because of fair play policy rules.
    </div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard-view" class="hidden">
  <div class="top-bar">
    <div><strong>LIVE DATA TERMINAL</strong> | Honey's Guess</div>
    <div style="display: flex; gap: 10px; align-items: center;">
      <input type="text" id="search-input" placeholder="Filter rooms..." oninput="renderRoomList()">
      <button onclick="logout()">Exit</button>
    </div>
  </div>
  
  <div class="fair-play-banner">
    Read-Only Mode. No changes can be done here, because of fair play policy rules.
  </div>

  <div class="main-content">
    <div class="room-list" id="room-list-container">
      <div class="no-rooms">Connecting to database...</div>
    </div>
    <div class="room-detail" id="room-detail-container">
      <div style="color: #666; text-align: center; margin-top: 50px;">Select a room from the left to view live data.</div>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCk4m0vOph9eGa9OOWRSgeJ6QFKWjJiAeo",
  authDomain: "honeys-guess.firebaseapp.com",
  databaseURL: "https://honeys-guess-default-rtdb.firebaseio.com",
  projectId: "honeys-guess",
  storageBucket: "honeys-guess.firebasestorage.app",
  messagingSenderId: "446449540684",
  appId: "1:446449540684:web:541c4cab8850808a0ddee9",
  measurementId: "G-N4DWJGVTN1"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const ADMIN_PASS = "honeysguess@1213";
let allRoomsData = {};
let selectedRoomCode = null;

function login() {
  if (document.getElementById('pass-input').value === ADMIN_PASS) {
    document.getElementById('login-view').classList.add('hidden');
    document.getElementById('dashboard-view').classList.remove('hidden');
    startLiveTracking();
  } else {
    alert("Access Denied");
  }
}

function logout() {
  db.ref('games').off();
  allRoomsData = {};
  selectedRoomCode = null;
  document.getElementById('login-view').classList.remove('hidden');
  document.getElementById('dashboard-view').classList.add('hidden');
}

function startLiveTracking() {
  db.ref('games').on('value', (snap) => {
    if (!snap.exists()) { allRoomsData = {}; } else { allRoomsData = snap.val(); }
    renderRoomList();
    if (selectedRoomCode) renderRoomDetail(selectedRoomCode);
  }, (error) => {
    console.error("Database error:", error);
  });
}

function renderRoomList() {
  const container = document.getElementById('room-list-container');
  const query = document.getElementById('search-input').value.trim().toUpperCase();
  container.innerHTML = '';
  
  const keys = Object.keys(allRoomsData);
  if (keys.length === 0) {
    container.innerHTML = '<div class="no-rooms">No rooms found.</div>';
    return;
  }

  const sortedKeys = keys.sort((a, b) => {
    const order = { 'playing': 1, 'choosing': 2, 'waiting': 3, 'finished': 4 };
    return (order[allRoomsData[a].status] || 5) - (order[allRoomsData[b].status] || 5);
  });

  let found = false;
  sortedKeys.forEach(code => {
    if (query && !code.includes(query)) return;
    found = true;
    const room = allRoomsData[code];
    const p1 = room.player1 ? room.player1.name : 'Empty';
    const p2 = room.player2 ? room.player2.name : 'Empty';
    
    const div = document.createElement('div');
    div.className = 'room-item' + (code === selectedRoomCode ? ' active' : '');
    div.onclick = function() { selectedRoomCode = code; renderRoomDetail(code); renderRoomList(); };
    
    div.innerHTML = '<div class="code">' + code + '</div>' +
      '<div style="font-size:12px; margin-top:2px;">' + p1 + ' vs ' + p2 + '</div>' +
      '<div class="status">' + room.status + ' | ' + (room.gameMode === 'word' ? 'Word' : 'Number') + '</div>';
    
    container.appendChild(div);
  });

  if (!found) container.innerHTML = '<div class="no-rooms">No matching rooms.</div>';
}

function renderRoomDetail(code) {
  const room = allRoomsData[code];
  if (!room) return;

  const container = document.getElementById('room-detail-container');
  
  let html = '<h2 style="margin-bottom: 15px; font-size: 18px; border-bottom: 2px solid #000; padding-bottom: 5px;">Room: ' + code + '</h2>';

  // 1. Game Configuration
  html += '<div class="detail-section"><h3>Game Configuration</h3><table>' +
    '<tr><th>Status</th><td>' + (room.status || 'N/A') + '</td></tr>' +
    '<tr><th>Game Mode</th><td>' + (room.gameMode === 'word' ? 'Word Guess' : 'Number Guess') + '</td></tr>' +
    '<tr><th>Current Turn</th><td>Player ' + (room.currentTurn || 'N/A') + '</td></tr>' +
    '<tr><th>Winner</th><td>' + (room.winner ? 'Player ' + room.winner : 'None') + '</td></tr>';
  
  if (room.gameMode === 'word') {
    html += '<tr><th>Word Length</th><td>' + (room.wordLength || 'N/A') + '</td></tr>';
  } else {
    html += '<tr><th>Number Range</th><td>1 - ' + (room.range || 'N/A') + '</td></tr>';
  }
  html += '</table></div>';

  // 2. Player 1
  html += '<div class="detail-section"><h3>Player 1 Data</h3>';
  if (room.player1) {
    html += '<table>' +
      '<tr><th>Name</th><td>' + (room.player1.name || 'N/A') + '</td></tr>' +
      '<tr><th>Ready</th><td>' + (room.player1.ready ? 'Yes' : 'No') + '</td></tr>' +
      '<tr><th>Guess Count</th><td>' + (room.player1.guessCount || 0) + '</td></tr>';
    if (room.gameMode === 'word') {
      html += '<tr><th>Secret Word</th><td style="font-weight:bold;">' + (room.player1.word || 'Not set') + '</td></tr>';
    } else {
      html += '<tr><th>Secret Number</th><td style="font-weight:bold;">' + (room.player1.number || 'Not set') + '</td></tr>';
    }
    html += '</table>';
  } else {
    html += '<p>Not joined.</p>';
  }
  html += '</div>';

  // 3. Player 2
  html += '<div class="detail-section"><h3>Player 2 Data</h3>';
  if (room.player2) {
    html += '<table>' +
      '<tr><th>Name</th><td>' + (room.player2.name || 'N/A') + '</td></tr>' +
      '<tr><th>Ready</th><td>' + (room.player2.ready ? 'Yes' : 'No') + '</td></tr>' +
      '<tr><th>Guess Count</th><td>' + (room.player2.guessCount || 0) + '</td></tr>';
    if (room.gameMode === 'word') {
      html += '<tr><th>Secret Word</th><td style="font-weight:bold;">' + (room.player2.word || 'Not set') + '</td></tr>';
    } else {
      html += '<tr><th>Secret Number</th><td style="font-weight:bold;">' + (room.player2.number || 'Not set') + '</td></tr>';
    }
    html += '</table>';
  } else {
    html += '<p>Not joined.</p>';
  }
  html += '</div>';

  // 4. Full Live Guess Log
  html += '<div class="detail-section"><h3>Live Guess History</h3>';
  if (room.guesses) {
    html += '<div class="guess-log">';
    // Convert object to array and sort by timestamp
    var guessArr = [];
    for (var key in room.guesses) { if (room.guesses.hasOwnProperty(key)) guessArr.push(room.guesses[key]); }
    guessArr.sort(function(a, b) { return (a.timestamp || 0) - (b.timestamp || 0); });

    for (var i = 0; i < guessArr.length; i++) {
      var g = guessArr[i];
      var pName = 'P' + g.playerNum;
      if (g.playerNum === 1 && room.player1) pName = room.player1.name;
      if (g.playerNum === 2 && room.player2) pName = room.player2.name;

      if (room.gameMode === 'word') {
        html += '<div class="guess-row">P' + g.playerNum + ' (' + pName + ') guessed letter: ' + g.letter + '</div>';
      } else {
        html += '<div class="guess-row">P' + g.playerNum + ' (' + pName + ') guessed number: ' + g.guess + ' -> Hint: ' + g.hint.toUpperCase() + '</div>';
      }
    }
    html += '</div>';
  } else {
    html += '<p style="font-size:12px; color:#666;">No guesses made yet.</p>';
  }
  html += '</div>';

  container.innerHTML = html;
}
</script>
</body>
</html>
